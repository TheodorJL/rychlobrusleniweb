# Kontrola a vydání šablony
#
# Na každý push se soubory zkontrolují. Z větve main se navíc vydá nová
# verze šablony jako ZIP — ten se dá buď nahrát ve WordPressu ručně,
# nebo si ho sám stáhne plugin Git Updater.
#
# Kontrola běží vždycky první. Když PHP obsahuje překlep, verze se nevydá
# a na webu se nic nezmění. Rozbitý PHP soubor jinak shodí web do bílé
# stránky — a k hostingu není přístup, takže by nebylo jak ho vrátit.

name: Kontrola a vydání

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # potřeba na vytvoření vydání (release)

concurrency:
  group: vydani-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────
  kontrola:
    name: Kontrola souborů
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nachystat PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Syntaxe PHP
        run: |
          chyby=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::$(php -l "$f" 2>&1 | head -1)"
              chyby=$((chyby+1))
            fi
          done < <(find wordpress theme -name '*.php' -print0)
          echo "Zkontrolováno: $(find wordpress theme -name '*.php' | wc -l) souborů PHP"
          [ "$chyby" -eq 0 ] || { echo "::error::Chybných souborů: $chyby"; exit 1; }

      - name: Syntaxe JavaScriptu
        run: node --check assets/js/csr-home.js

      - name: Struktura balíčku
        run: python3 .github/kontrola.py

      - name: Sestavit šablonu
        run: bash .github/sestavit.sh

      - name: Uložit šablonu ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: csr-child
          path: build/csr-child
          retention-days: 30


  # ────────────────────────────────────────────────────────────────
  # Větev se složenou šablonou.
  #
  # V main leží soubory roztříděné podle toho, k čemu slouží — v kořeni
  # tedy není style.css a WordPress by repozitář jako šablonu nepoznal.
  # Tahle větev obsahuje hotovou šablonu rovnou v kořeni, takže si ji
  # umí stáhnout kterýkoli plugin, co tahá z Gitu.
  #
  # Historie větve je jednorázová — pokaždé se přepíše. Je to výstup
  # sestavení, ne zdroj; upravovat se má main.
  vetev-sablona:
    name: Aktualizovat větev „sablona"
    needs: kontrola
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sestavit šablonu
        run: bash .github/sestavit.sh

      - name: Očíslovat verzi
        run: |
          sed -i "s/^Version: .*/Version:     1.0.${{ github.run_number }}/" build/csr-child/style.css
          grep -m1 "^Version:" build/csr-child/style.css

      - name: Publikovat
        run: |
          cd build/csr-child
          git init -q -b sablona
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Šablona 1.0.${{ github.run_number }} ze commitu ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sablona
          echo "::notice::Větev sablona aktualizována na verzi 1.0.${{ github.run_number }}"

  # ────────────────────────────────────────────────────────────────
  vydani:
    name: Vydat novou verzi
    needs: kontrola
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sestavit šablonu
        run: bash .github/sestavit.sh

      # Číslo verze musí po každé změně vyrůst, jinak WordPress aktualizaci
      # nenabídne. Poslední část je pořadové číslo běhu, takže se o ni
      # nikdo nemusí starat.
      - name: Očíslovat verzi
        id: verze
        run: |
          VERZE="1.0.${{ github.run_number }}"
          sed -i "s/^Version: .*/Version:     $VERZE/" build/csr-child/style.css
          grep -m1 "^Version:" build/csr-child/style.css
          echo "verze=$VERZE" >> "$GITHUB_OUTPUT"

      - name: Zabalit
        run: |
          cd build
          zip -rq "csr-child.zip" csr-child
          echo "Velikost: $(du -h csr-child.zip | cut -f1)"

      - name: Vydat
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.verze.outputs.verze }}
          name: Verze ${{ steps.verze.outputs.verze }}
          body: |
            Šablona pro WordPress — nahrajte `csr-child.zip` ve *Vzhled →
            Šablony → Přidat novou → Nahrát šablonu*, nebo ji nechte
            stáhnout plugin Git Updater.

            Změny: ${{ github.event.head_commit.message }}
          files: build/csr-child.zip
          make_latest: true
